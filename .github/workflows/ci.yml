name: CI

on:
  pull_request:
    branches: [main, workshop]
  push:
    branches: [workshop]

jobs:
  check:
    name: typecheck + lint + build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 与本地 .githooks/pre-commit 同源的检查（双重保险）
      - name: TypeScript check
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
        env:
          # workshop 默认无 LLM key，build 时不需要
          ANTHROPIC_API_KEY: ""
